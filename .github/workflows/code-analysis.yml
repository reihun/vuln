# .github/workflows/codeql.yml
name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Chạy tự động mỗi Chủ nhật 5h sáng UTC

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # Bắt buộc để upload kết quả
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript   # hoặc: javascript,typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
