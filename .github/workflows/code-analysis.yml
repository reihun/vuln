# .github/workflows/codeql-analysis.yml
name: "CodeQL - JavaScript/TypeScript"

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '30 4 * * 0'  # Chạy tự động mỗi Chủ nhật 4:30 UTC

jobs:
  codeql-js:
    name: CodeQL JavaScript Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # Bắt buộc để upload SARIF

    strategy:
      fail-fast: false
      matrix:
        language: [ javascript, typescript ]   # QUAN TRỌNG: phải là javascript/typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CodeQL hỗ trợ JS/TS mà KHÔNG cần build gì cả
      # Chỉ cần cài Node để CodeQL extract dependencies (package.json, yarn.lock, etc.)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # hoặc 18, 22 tùy project
          cache: 'npm'       # hoặc 'yarn', 'pnpm'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Tùy chọn: dùng config file chuyên JS để tìm endpoint, secret, XSS, prototype pollution...
          config-file: .github/codeql/codeql-config-js.yml
          # Nếu chưa có config thì bỏ dòng này → CodeQL vẫn scan tốt (dùng default JS queries)

      # QUAN TRỌNG: Với JS không dùng autobuild → phải bỏ hoặc comment
      # - name: Autobuild → XÓA HOÀN TOÀN DÒNG NÀ
