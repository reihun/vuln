# .github/workflows/codeql-analysis.yml
name: "CodeQL - Spring Boot"

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
    # Chạy tự động mỗi Chủ nhật lúc 4:30 UTC

jobs:
  codeql:
    name: CodeQL Scan (Spring Boot)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # Bắt buộc để upload kết quả SARIF
      packages: read

    strategy:
      fail-fast: false
      matrix:
        # Chỉ scan Java/Kotlin – Spring Boot dùng 2 ngôn ngữ này
        language: [ java ]       # Nếu project dùng Kotlin thì đổi thành 'java,kotlin' hoặc thêm dòng dưới
        # language: [ java, kotlin ]

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Cần cho một số rule phân tích lịch sử commit

      # 2. Setup JDK (tự động detect Java 8/11/17/21 tùy pom.xml/gradle)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17     # Thay bằng 11, 21 nếu project dùng version khác
          cache: maven         # Tự cache Maven, nếu dùng Gradle thì đổi thành 'gradle'

      # 3. Khởi tạo CodeQL + dùng config file chuyên Spring Boot
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml   # ← Dùng file config Spring Boot bạn đã tạo
          # Nếu bạn chưa tạo config file thì bỏ dòng này → CodeQL sẽ tự scan toàn bộ (chậm + dễ lỗi)

      # 4. Build project (Maven hoặc Gradle đều được tự động)
      - name: Build with Autobuild (Maven/Gradle)
        uses: github/codeql-action/autobuild@v3
        # CodeQL sẽ tự chạy: mvn compile hoặc ./gradlew classes tùy project

      # Nếu Autobuild lỗi (hiếm), bạn có thể thay bằng lệnh thủ công:
      # - name: Build with Maven
      #   run: mvn -B -V clean compile -DskipTests
      #
      # - name: Build with Gradle
      #   run: ./gradlew classes --no-daemon

      # 5. Chạy scan CodeQL
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
