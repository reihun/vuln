name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['java']  # Hoặc thêm 'javascript' nếu cần

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # Cập nhật version mới nhất

    # THÊM STEP NÀY: Setup Java (JDK 17 cho Spring Boot hiện đại)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'  # Hoặc version của project bạn (check pom.xml)
        distribution: 'temurin'  # Hoặc 'zulu', 'adopt'
        cache: 'maven'  # Cache Maven để nhanh hơn


    - name: Build Spring boot 
      run: ./mvnw -B clean compile
    # THAY THẾ AUTOBUILD BẰNG BUILD MAVEN (skip tests để tránh fail)
    - name: Build with Maven
      run: mvn clean compile -B -DskipTests  # Hoặc 'mvn clean package' nếu cần full build
      # Nếu pom.xml ở subfolder (ví dụ: /backend/pom.xml), dùng: mvn clean compile -f backend/pom.xml -B -DskipTests

    # Giữ nguyên các step sau
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality  # Optional: Thêm quality checks

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
