<div class="line tinymce">
    <div class="content_container">
        <span>Tooltip content</span>
    </div>
    <div class="content_container mb-5">
        <div class="line no_break style_templates_container">
            Style:&nbsp;
            <select class="style_templates"></select>
        </div>
        <div class="language_selector_container">
            <i class='fa fa-language' aria-hidden='true'></i>
            <select id="tooltip_language_selector"></select>
        </div>
    </div>
    <div id="tooltip_editor" class="editor"></div>
    <div class="content_container"><input type="checkbox" class="display_on_startup">Display on startup</input></div>
    <div class="content_container"><input type="checkbox" class="hide_when_mouseout">Hide tooltip when moving
        mouseout</input></div>
    <div class="content_container"><input type="checkbox" class="tooltipFixedPosision">Fixed Position</input></div>
</div>
<div class="line">
    <span>Tooltip Position</span>
    <div style="display: flex;align-items: center;"><input type="checkbox" class="tooltip_pos_auto" checked>Auto
        </intput>
    </div>
    <div class="tooltip_position_area">
        <div class="element"></div>
        <div class="tooltip" pos="left"></div>
        <div class="tooltip" pos="top"></div>
        <div class="tooltip" pos="right"></div>
        <div class="tooltip" pos="bottom"></div>
    </div>
</div>
