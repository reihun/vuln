<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <link href='https://fonts.googleapis.com/css?family=Nunito Sans' rel='stylesheet'>
    <link rel="stylesheet" href="css/fonts/font-awesome.min.css">
    <link rel="stylesheet" href="css/video_urls.css">
    <link rel="stylesheet" href="css/dialog.css">
</head>

<body>
    <div class="header">
        <span class="title">Utilities/Video URL Scan</span>
        <div class="buttons">
            <button class="scan"><i class="fa fa-search"></i> Scan</button>
            <button class="cancel"><i class="fa fa-window-close"></i> Cancel</button>
        </div>
    </div>
    <div class="body">
        
    </div>
    <div class="template line">
            <span class="type"></span>
            <button class="play"><i class="fa fa-play" aria-hidden="true"></i></button>
            <button class="copy_url"><i class="fa fa-clone" aria-hidden="true"></i></button>
            <button class="download"><i class="fa fa fa-download" aria-hidden="true"></i></button>
            <span class="title"></span>
            <span class="length">0 MB</span>
    </div>
    <script src="js/common_funcs.js"></script>
    <script src="js/video_urls.js"></script>
    <script src="js/dialog.js"></script>
</body>

</html>
