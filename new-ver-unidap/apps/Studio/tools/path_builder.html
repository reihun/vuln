<div class="top">
    Path Builder tool<button class="close"><i class="fa fa-close"></i></button>
</div>
<div class="selected_element">
    <div class="pathSelector"></div>
    <div class="iframe">
        <div class="line">
            <span>Iframe </span>
            <select class="path_operator">
                <option value="contains" selected>Contains</option>
                <option value="not_contain">Not Contain</option>
                <option value="starts_with">Starts With</option>
                <option value="ends_with">Ends With</option>
                <option value="regex">Regex</option>
                <option value="wildcard">Wildcard (?|*)</option>
            </select>
        </div>
        <div class="line">
            <input type="text" maxlength="50"></input>
        </div>
    </div>
</div>

<div class="header">
    <div>
        <button class="auto"><i class="fa fa-cog" aria-hidden="true"></i> <span>Auto</span></button>
        <button class="manual"><i class="fa fa-book" aria-hidden="true"></i> Manual</button>
    </div>
    <button class="regenerate_path"><i class="fa fa-link" aria-hidden="true"></i> Use this path</button>
</div>
<div class="path_auto">
    <button class="inspect"><i class="fa fa-search" aria-hidden="true"></i> <span>Inspect</span></button>
    <div class="iframe_info">
        <div class="line custom_url_pannel">
            <div>
                <span>Iframe URL:</span>
                <select class="url_operator">
                    <option value="equals" selected>Equals</option>
                    <option value="contains">Contains</option>
                    <option value="not_contain">Not Contain</option>
                    <option value="starts_with">Starts With</option>
                    <option value="ends_with">Ends With</option>
                    <option value="regex">Regex</option>
                    <option value="wildcard">Wildcard (?|*)</option>
                </select>
            </div>
            <div><input class="new_url" type="text"></input></div>
        </div>
    </div>
    <div class="item_tab_header"></div>
</div>
<div class="path_manual">
    <textarea></textarea>
    <div class="control">
        <button class="test"><i class="fa fa-search"></i> Test</button>
    </div>
</div>
<div class="template">
    <div class="element" tag_name="">
        <div class="pannel">
            <div class="tag_info">
                <input type="checkbox" checked>
                <div class="element_tag_name"></div>
            </div>
            <div class="buttons">
                <button class="expand"><i class="fa fa-chevron-circle-down" aria-hidden="true"></i></button>
                <button>Idx</button>
                <button>Txt</button>
                <button>Cls</button>
                <button>Atr</button>
                <button>Has</button>
            </div>
        </div>
        <div class="configuration">
            <div class="Index">
                <select>
                    <option value="custom">Custom</option>
                    <option value="first">Fist child</option>
                    <option value="last">Last child</option>
                </select>
                <div class="custom"><input type="number" step="1" min="1"></input><span>(starts from 1)</span></div>
            </div>
            <div class="Classes">
                <div class="operator"><input type="radio" value="and" checked>And</input><input type="radio"
                        value="or">Or</input>
                </div>
                <select multiple>
                    <option value=""></option>
                </select>
            </div>
            <div class="Text">
                <select>
                    <option value="none" selected>[None]</option>
                    <option value="contains">Contains</option>
                    <option value="equals">Equals</option>
                    <option value="starts-with">Starts with</option>
                    <option value="ends-with">Ends with</option>
                </select>
                <textarea></textarea>
            </div>
            <div class="Attributes">
                <div class="operator"><input type="radio" value="and" checked>And</input><input type="radio"
                        value="or">Or</input>
                </div>
                <div class="attribute movable">
                    <div class="remove_item"><button class="remove" disabled><i class="fa fa-trash-o"
                                aria-hidden="true"></i></button></div>
                    <div class="key">
                        <div class="col1">
                            <select class="name" disabled>
                            </select>
                            <select disabled class="operator">
                                <option value="contains">Contains</option>
                                <option value="equals" selected>Equals</option>
                            </select>
                        </div>

                    </div>
                    <div class="value">
                        <div class="col1"><input type="text" disabled></input></div>
                        <div class="col2"><button class="search" disabled><i class="fa fa-search"
                                    aria-hidden="true"></i></button>
                        </div>
                    </div>
                </div>
                <button class="more"><i class="fa fa-plus"></i></button>
            </div>
        </div>
    </div>
</div>
