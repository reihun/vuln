<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link href='https://fonts.googleapis.com/css?family=Nunito Sans' rel='stylesheet'>
    <link rel="stylesheet" href="css/fonts/font-awesome.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/dialog.css">
</head>

<body>
    <div class="header">
        <button class="save"><i class="fa fa-save"></i> Save</button>
        <button class="cancel"><i class="fa fa-window-close"></i> Cancel</button>
    </div>
    <div class="custom variables">
        <div class="group">
            <div class="header">
                <div class="line">
                    Group name:
                    <select class="group_selection">
                        <option value="new">----New group----</option>
                    </select>
                    <button class="remove"><i class="fa fa-trash-o" aria-hidden="true"></i>Remove Group</button>
                </div>
                <div class="line">
                    <input class="text lv2 group_name restricted_keys" placeholder="Enter group name..."></input>
                    <select class="type">
                        <option value="System">System</option>
                        <option value="Custom">Custom</option>
                    </select>
                </div>
            </div>
            <button class="more"><i class="fa fa-plus"></i></button>
            <div class="var_detail">
                <div class="header">
                    Variable Name <input class="text restricted_keys" placeholder="Enter variable name...."></input>
                </div>
                <div class="content">
                    <!-- <div class="header">
                        <div class="line">
                            Add Variable <select class="existing_vargroups">
                                <option class="none" selected>None</option>
                            </select><select class="existing_vars"></select>
                            <button class="insert_existing_var"><i class="fa fa-plus"></i></button>
                        </div>
                    </div> -->
                    <div class="content">
                        <textarea class="editor script"></textarea>
                        <button class="verify"><i class="fa fa-check"></i>Verify</button>
                    </div>
                </div>
            </div>
            <div class="listing">
                <div class="header">
                    Existing variables
                </div>
                <div class="content">
                    <div class="item template">
                        <div class="row1">
                            <div class="col1">
                                <span class="index">1</span>
                            </div>
                            <div class="col2">
                                <span class="name">test</span>
                            </div>
                        </div>
                        <div class="row2">
                            <div class="col1"></div>
                            <div class="col2">
                                <div class="button">
                                    <button class="remove"><i class="fa fa-trash-o" aria-hidden="true"></i></button>
                                    <button class="edit"><i class="fa fa-edit"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="pre_configured variables">
        <div class="header"></div>
        <div class="groups">
            <div class="header"></div>
            <div class="items"></div>
        </div>
    </div>
    <div id="popup">
        <div class="dialog">
            <div class="header">
                <div class="title"></div>
                <button class="close"><i class="fa fa-close"></i></button>
            </div>
            <div class="content"></div>
            <div class="footer">
                <div class="status"></div>
                <div class="buttons">
                    <button class="btn1"></button>
                    <button class="btn2"></button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/variables.js"></script>
    <script src="js/dialog.js"></script>
</body>

</html>
