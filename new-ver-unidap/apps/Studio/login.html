<!DOCTYPE html>
<html>
<head>
  <title>Login Status</title>
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <div class="login_container">
    <h2 class="login_header">Login</h2>
    <div class="login_body">
      <div class="item">API Base Endpoint: <input type="text" id="endpoint" ></div>
        <div class="item">SSO API Endpoint: <input type="text" id="ssoEndpoint" ></div>
        <div id="login_status">
          <p class="checking_status">Checking login status...</p>
          <button class="login_btn">Login</button>
        </div>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
