<div class="resource_selection">
    <div class="line">
    <span>Resource:</span>
    <select class="resources">
        <option value="-1">--None--</option>
    </select>
    </div>
    <div class="line">
    <span>Showing:</span>
    <select class="mode">
        <option value="display">Display</option>
        <option value="link">Link</option>
    </select>
    </div>
    <div class="showing_options">
        <div class="option display">
            <div class="viewer line">
                <span>Viewer:&nbsp;</span>
                <select class="type">
                    <option value="image">Image</option>
                    <option value="pdf">PDF</option>
                    <option value="video">Video</option>
                </select>
            </div>
            <div class="resolution">
                <div class="line"><span>Height:&nbsp;</span><input type="number" name="height" class="height"> px</div>
                <div class="line"><span>Width:&nbsp;</span><input type="number" name="width" class="width"> px</div>
            </div>
        </div>
        <div class="option link line">
            <span>Link Text:&nbsp;</span><input type="text" class="link_text">
        </div>
    </div>
</div>
