<div class="line">
    <span>Title</span>
    <input class="title" placeholder="Name the popup..."></input>
</div>
<div class="header popup_header">
    <div>
        <span class="content selected">Content</span>
        <span class="css type internal">CSS</span>
        <span class="advanced">Advanced</span>
    </div>

</div>
<div class="tab Content">
    <div class="header">
        Type:
        <select class="type_selection">
            <option value="internal">HTML</option>
            <option value="link">External Link</option>
        </select>
        <div class="language_selector_container internal">
            <i class='fa fa-language' aria-hidden='true'></i>
            <select id="popup_language_selector"></select>
        </div>
    </div>
    <div class="internal type">
        <div class="editor" id="popup_content_editor"></div>
        <div class="unlock_btn">
            <button class="advanced"><i class="fa fa-diamond" aria-hidden="true"></i> Continue editing on advanced
                Editor</button>
            <button class="simple"><i class="fa fa-chain-broken" aria-hidden="true"></i> Move content back to Simple
                Editor</button>
        </div>
    </div>
    <div class="link type">
        <span class="line">URL:</span>
        <input type="text" class="url line" placeholder="Enter the url here..."></input>
        <div class="line">Width: <input type="number" class="width"></input>(px) | Height: <input type="number"
                class="height"></input>(px)</div>
    </div>
</div>
<div class="tab CSS">
    <textarea class="editor" id="popup_content_css"></textarea>
</div>
<div class="tab Advanced">
    <div class="when block">
        <div class="header">When</div>
        <div class="content">
            <select class="when_condition">
                <option value="page_view">Page View</option>
                <option value="per_call" selected>Per Call</option>
            </select>
        </div>
    </div>
    <div class="popup_type block">
        <div class="header">Popup type</div>
        <div class="content">
            <div class="line">
                <select class="position">
                    <option value="inner">Inner</option>
                    <option value="outer">Outer</option>
                </select>
            </div>
            <div class="line window_type">
                <select>
                    <option value="new_window">New Window</option>
                    <option value="new_tab">New Tab</option>
                </select>
            </div>
        </div>
    </div>
    <div class="adv_editor block type internal">
        <div class="header"><button><i class="fa fa-diamond" aria-hidden="true"></i> Open in advanced
                Editor</button></div>
    </div>
    <div class="where block">
        <div class="header">Position</div>
        <div class="content">
            <div class="position_area">
                <div class="position" pos="top_left"></div>
                <div class="position" pos="top_middle"></div>
                <div class="position" pos="top_right"></div>
                <div class="position" pos="bottom_left"></div>
                <div class="position" pos="bottom_middle"></div>
                <div class="position" pos="bottom_right"></div>
                <div class="position" pos="middle_right"></div>
                <div class="position" pos="middle_left"></div>
                <div class="position popup" pos="center"></div>
            </div>
        </div>
    </div>
    <div class="others block">
        <div class="header">More options</div>
        <div class="content">
            <div class="line">
                <div><input type="checkbox" class="make_it_spotlight"></input>Spotlight</div>
            </div>
            <div class="line">
                <div><input type="checkbox" class="show_button" checked></input>Show Buttons</div>
            </div>
            <div class="line">
                <div><input type="checkbox" class="hide_tab_bar" checked></input>Hide Tab Bar</div>
            </div>
        </div>
    </div>
</div>
